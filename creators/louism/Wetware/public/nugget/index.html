<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nugget Pad">
  <meta name="theme-color" content="#050507">
  <link rel="manifest" href="/api/manifest/nugget">
  <link rel="apple-touch-icon" href="/app-icons/nugget-192.png">

<body>
  <button id="fullscreenGate" class="fullscreen-gate" type="button" hidden>
    <strong>TAP TO ENTER FULLSCREEN</strong>

  <div id="status" class="status connecting" role="status" aria-live="polite"><i></i><span>CONNECTING</span></div>

  <main id="launchpad" aria-label="Nugget slide launchpad"></main>
  <script type="module" src="./nugget.js?v=3"></script>
