<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Axelerometric · Present</title>
    <link rel="stylesheet" href="style.css?v=motion-1">
    <script src="vendor/p5.min.js"></script>
</head>
<body class="present">
    <main class="workspace">
        <canvas id="spectrum-plot" role="img" aria-label="Chamber spectra"></canvas>
        <div id="stage" aria-label="Drag to orbit the rooms, pinch to zoom"></div>
        <canvas id="bass-chamber" role="img" aria-label="Bass drum chamber, alternating floor and ceiling hits on each beat"></canvas>
    </main>
    <div id="join" class="join">
        <h1>Axelerometric</h1>
        <p id="join-status" role="status">Connecting to the controller…</p>
        <button id="enter" disabled>Enter fullscreen with sound</button>
        <label data-audio-settings>Audio output<select id="output-layout">
            <option value="stereo">Stereo</option>
            <option value="headphones">Headphones · 3D</option>
            <option value="tracked">Headphones · Tracked 3D</option>
            <option value="direct">4.1 · interface (1–5)</option>
            <option value="surround">4.1 · 5.1 receiver</option>
        </select></label>
        <span data-audio-settings id="tracking-status" role="status" hidden></span>
        <label data-audio-settings>Optional local samples<input id="local-files" type="file" multiple accept="audio/*"></label>
    </div>
    <script src="js/common_custom.js?v=lan-1"></script>
    <script src="js/motion_control.js?v=motion-1"></script>
    <script src="js/lan.js?v=fixed-fx-1"></script>
    <script src="js/sphere_bounce.js?v=front-bar-1"></script>
    <script src="js/sound_engine.js?v=fixed-fx-1"></script>
    <script src="js/bass_chamber.js?v=hat-animation-1"></script>
    <script src="js/room_tiles.js?v=tiles-2"></script>
    <script src="js/spectrum_view.js?v=solo-1"></script>
    <script src="js/room_fx.js?v=fixed-fx-1"></script>
    <script src="js/solo.js?v=fixed-fx-1"></script>
    <script src="js/scene.js?v=fx-color-stutter-1"></script>
    <script src="js/sample_cache.js"></script>
    <script src="js/present.js?v=motion-1"></script>
</body>
</html>
